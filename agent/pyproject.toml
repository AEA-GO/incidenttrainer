[project]
name = "itr-agent"
version = "0.1.0"
description = "IncidentTrainer agent: the referee on every game server"
readme = "README.md"
authors = [
    { name = "Andrii Danchylo", email = "133139212+danchylo@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
itr-agent = "itr_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
