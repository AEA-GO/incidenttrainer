global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: shop
    honor_labels: true   # keep the apps' own service label
    static_configs:
      - targets: ["storefront:8000"]
        labels: {service: storefront}
      - targets: ["catalog:8000"]
        labels: {service: catalog}
