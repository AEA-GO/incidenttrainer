# CI for every pull request and every push to main.
#   checks          : pre-commit on all files (format, ruff, terraform fmt, ...), same tool versions as laptops (mise.toml),
#                     then the API's tests
#   secrets         : gitleaks over the whole git history
#   aws-sign-in     : proves GitHub can sign in to AWS with OIDC (read-only plan role)
#   terraform-plan  : PRs only: plans infra/envs/main with the read-only role and posts the plan on the PR
#   terraform-apply : pushes to main only: applies infra/envs/main with the apply role, in the GitHub environment "main"
#   deploy-web      : pushes to main only, after terraform-apply: builds web/ (or the placeholder page) and uploads it
#   deploy-api      : pushes to main only, after terraform-apply: packages api/ for Lambda (arm64), deploys, smoke-tests
# Jobs that need AWS are skipped for PRs from forks (they get no OIDC token).
# infra/bootstrap is never applied by CI: the lead applies it by hand.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned tools from mise.toml (node, terraform, uv)
        uses: jdx/mise-action@v5

      - name: pre-commit on all files
        run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          # The pre-commit gitleaks hook only scans staged changes; the secrets job scans everything.
          SKIP: gitleaks

      - name: API tests
        if: hashFiles('api/pyproject.toml') != ''
        working-directory: api
        run: uv run --frozen pytest -q

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so old commits are scanned too

      - name: gitleaks over the whole history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --verbose --no-banner

  aws-sign-in:
    name: aws-sign-in
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for an OIDC token
    steps:
      - name: Sign in to AWS with the read-only plan role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Who am I in AWS
        run: aws sts get-caller-identity

  terraform-plan:
    name: terraform-plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write # to post the plan as a PR comment
    defaults:
      run:
        working-directory: infra/envs/main
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned tools from mise.toml
        uses: jdx/mise-action@v5

      - name: Sign in to AWS with the read-only plan role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init and plan
        id: plan
        run: |
          {
            terraform init -input=false -no-color
            terraform plan -input=false -no-color -lock-timeout=2m -out=tfplan
          } 2>&1 | tee plan.txt

      - name: Post the plan on the PR
        if: always() && steps.plan.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.plan.outcome }}
        run: |
          touch plan.txt
          summary=$(grep -E '^(Plan:|No changes\.|Error:)' plan.txt | head -n 3 || true)
          {
            echo "### Terraform plan for \`infra/envs/main\`: ${OUTCOME}"
            echo
            echo "${summary:-No summary line found; open the full plan.}"
            echo
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
            echo "</details>"
          } > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none \
            || gh pr comment "$PR" --body-file comment.md

  terraform-apply:
    name: terraform-apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: main # the apply role trusts only jobs in this environment
    concurrency:
      group: terraform-apply-main
      cancel-in-progress: false # never stop an apply halfway
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/envs/main
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned tools from mise.toml
        uses: jdx/mise-action@v5

      - name: Sign in to AWS with the apply role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: terraform init -input=false -no-color

      - name: terraform apply
        run: terraform apply -input=false -no-color -auto-approve -lock-timeout=5m

  deploy-web:
    name: deploy-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [terraform-apply]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: main
    concurrency:
      group: deploy-web-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned tools from mise.toml
        uses: jdx/mise-action@v5

      - name: Build the website
        id: build
        run: |
          if [ -f web/package.json ]; then
            (cd web && npm ci && npm run build)
            echo "dir=web/dist" >> "$GITHUB_OUTPUT"
          else
            echo "No web/ app yet: deploying the placeholder page."
            echo "dir=.github/placeholder-site" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign in to AWS with the apply role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Read the bucket and distribution from Terraform
        id: tf
        working-directory: infra/envs/main
        run: |
          terraform init -input=false -no-color > /dev/null
          echo "bucket=$(terraform output -raw website_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw website_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform output -raw website_url)" >> "$GITHUB_OUTPUT"

      - name: Upload and refresh CloudFront
        env:
          DIR: ${{ steps.build.outputs.dir }}
          BUCKET: ${{ steps.tf.outputs.bucket }}
          DISTRIBUTION: ${{ steps.tf.outputs.distribution }}
          URL: ${{ steps.tf.outputs.url }}
        run: |
          # Hashed assets can be cached for a year; index.html must always be re-checked.
          aws s3 sync "$DIR" "s3://$BUCKET" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "$DIR/index.html" "s3://$BUCKET/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*" \
            --query Invalidation.Id --output text
          echo "Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"

  deploy-api:
    name: deploy-api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [terraform-apply]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: main
    concurrency:
      group: deploy-api-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned tools from mise.toml
        uses: jdx/mise-action@v5

      - name: Package api/ for Lambda (Python 3.13, arm64)
        run: |
          mkdir -p build/pkg
          (cd api && uv export --frozen --no-dev --no-hashes --no-emit-project -o ../build/requirements.txt)
          uv pip install --target build/pkg --python-platform aarch64-manylinux2014 \
            --python-version 3.13 --only-binary :all: -r build/requirements.txt
          cp -r api/src/itr_api build/pkg/
          echo "${GITHUB_SHA::7}" > build/pkg/itr_api/VERSION
          (cd build/pkg && zip -qr ../api.zip . -x '*/__pycache__/*')
          ls -lh build/api.zip

      - name: Sign in to AWS with the apply role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Read the function name and site URL from Terraform
        id: tf
        working-directory: infra/envs/main
        run: |
          terraform init -input=false -no-color > /dev/null
          echo "function=$(terraform output -raw api_function_name)" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform output -raw website_url)" >> "$GITHUB_OUTPUT"

      - name: Deploy the code
        env:
          FUNCTION: ${{ steps.tf.outputs.function }}
        run: |
          aws lambda update-function-code --function-name "$FUNCTION" \
            --zip-file fileb://build/api.zip --query LastUpdateStatus --output text
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"

      - name: Smoke test through CloudFront
        env:
          URL: ${{ steps.tf.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if body=$(curl -fsS "$URL/api/health"); then
              echo "$body"
              echo "API: $URL/api/health → $body" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL/api/health did not answer"
          exit 1
