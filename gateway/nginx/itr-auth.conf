# Included in every /s/ location: ask gateway-auth first, keep its answer, and give every
# refusal the contract's JSON body. (A location that sets any error_page inherits none
# from the server block, so all of them live here.)
auth_request /_itr_auth;
auth_request_set $itr_upstream $upstream_http_x_itr_upstream;
auth_request_set $itr_game_id  $upstream_http_x_itr_game_id;
auth_request_set $itr_status   $upstream_http_x_itr_status;
auth_request_set $itr_code     $upstream_http_x_itr_code;
auth_request_set $itr_retry    $upstream_http_x_itr_retry;
error_page 403 = @itr_deny;
error_page 413 = @too_big;
error_page 429 = @too_fast;
error_page 502 504 = @unreachable;
