# The gateway's nginx (contract 5, docs/contracts/game-path.md). Goes in /etc/nginx/conf.d/.
# Every /s/<game_id>/... request asks gateway-auth (127.0.0.1:9000) first; it answers
# "forward to <private ip>" or "refuse" (403 + X-Itr-Status/X-Itr-Code), and refusals get
# their body from gateway-auth's /deny (itr-auth.conf). nginx picks the port from the path,
# never from the browser.

map $http_upgrade $itr_connection {
    default upgrade;
    ""      close;
}

# The game id from the path, for per-game limits.
map $uri $itr_game {
    "~^/s/(?<id>[A-Za-z0-9_-]{22})/" $id;
    default                          "";
}

limit_req_zone  $itr_game zone=itr_agent:1m   rate=10r/s;
limit_req_zone  $itr_game zone=itr_grafana:1m rate=50r/s;
limit_conn_zone $itr_game zone=itr_term:1m;
limit_req_status  429;
limit_conn_status 429;

log_format itr escape=json '{"time":"$time_iso8601","request_id":"$request_id","game_id":"$itr_game",'
                           '"method":"$request_method","uri":"$uri","status":$status,'
                           '"bytes":$body_bytes_sent,"seconds":$request_time,"upstream":"$upstream_addr"}';

upstream itr_gateway_auth {
    server 127.0.0.1:9000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/itr-access.log itr;

    default_type application/json;

    # --- agent: /s/<id>/api/v1/<rest> -> :8080/v1/<rest>
    location ~ "^/s/[A-Za-z0-9_-]{22}/api/v1/(?<itr_rest>.*)$" {
        set $itr_uri $uri;  # the normalised path (no "..") is what gateway-auth checks
        include /etc/nginx/itr-auth.conf;

        limit_req zone=itr_agent burst=20 nodelay;
        client_max_body_size 64k;
        proxy_read_timeout 35s;
        include /etc/nginx/itr-proxy-headers.conf;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
        proxy_pass http://$itr_upstream:8080/v1/$itr_rest$is_args$args;
    }

    # --- Grafana: path unchanged (it knows its sub-path from the claim)
    location ~ "^/s/[A-Za-z0-9_-]{22}/grafana/" {
        set $itr_uri $uri;
        include /etc/nginx/itr-auth.conf;

        limit_req zone=itr_grafana burst=200 nodelay;
        client_max_body_size 1m;
        proxy_read_timeout 60s;
        include /etc/nginx/itr-proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;  # Grafana Live
        proxy_set_header Connection $itr_connection;
        proxy_pass http://$itr_upstream:3000$request_uri;
    }

    # --- terminal: /s/<id>/term/<rest> -> ttyd :7681/<rest> (token, ws)
    location ~ "^/s/[A-Za-z0-9_-]{22}/term/(?<itr_rest>.*)$" {
        set $itr_uri $uri;
        include /etc/nginx/itr-auth.conf;

        limit_conn itr_term 2;
        client_max_body_size 64k;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        include /etc/nginx/itr-proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $itr_connection;
        proxy_pass http://$itr_upstream:7681/$itr_rest$is_args$args;
    }

    # --- anything else: not ours (8081, the agent's control port, is never reachable)
    location / {
        return 404 '{"error":{"code":"not_found","message":"There is no such game or page."}}\n';
    }

    # --- gateway-auth, internal only
    location = /_itr_auth {
        internal;
        proxy_pass http://itr_gateway_auth/auth;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $itr_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Request-Id $request_id;
        # Cookie and Origin go along as the browser sent them.
    }

    location @itr_deny {
        rewrite ^ /deny break;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie "";
        proxy_set_header X-Original-URI $itr_uri;
        proxy_set_header X-Itr-Status $itr_status;
        proxy_set_header X-Itr-Code $itr_code;
        proxy_set_header X-Itr-Retry $itr_retry;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://itr_gateway_auth;
    }

    location @too_fast {
        add_header Retry-After 1 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":{"code":"too_fast","message":"Too many requests. Slow down a little.","retry_after_s":1}}\n';
    }

    location @too_big {
        return 413 '{"error":{"code":"too_big","message":"That request is too big."}}\n';
    }

    location @unreachable {
        add_header Cache-Control "no-store" always;
        return 502 '{"error":{"code":"server_unreachable","message":"Your game server did not answer."}}\n';
    }
}
