# The gateway's nginx on a laptop, in front of the agent and Grafana on this machine.
# Same config as the gateway server, with three laptop changes made at start:
#   listens on 8088 (not 80), logs to the container's output, and adds /s/<game>/dev-login.
# gateway-auth itself runs on the laptop: dev/run-auth.sh (127.0.0.1:9000).
name: itr-gateway-dev
services:
  nginx:
    image: nginx:1.30.6-alpine
    network_mode: host  # reaches 127.0.0.1:9000 (gateway-auth), :8080 (agent), :3000 (Grafana)
    volumes:
      - ../nginx:/itr/nginx:ro
      - ./dev-login.conf:/itr/dev-login.conf:ro
    command:
      - sh
      - -c
      - |
        cp /itr/nginx/itr-auth.conf /itr/nginx/itr-proxy-headers.conf /etc/nginx/
        sed -e 's#listen 80 default_server;#listen 8088 default_server;#' \
            -e 's#access_log /var/log/nginx/itr-access.log itr;#access_log /dev/stdout itr;#' \
            -e "s#server_tokens off;#server_tokens off; include /itr/dev-login.conf;#" \
            /itr/nginx/itr-gateway.conf > /etc/nginx/conf.d/default.conf
        nginx -t && exec nginx -g 'daemon off;'
    restart: unless-stopped
